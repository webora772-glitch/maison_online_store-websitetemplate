document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

A;\n  --charcoal:#1C1C1A;\n  --mid:#6B6B64;\n  --border:#E2DED6;\n  --accent:#8B6F4E;\n  --accent-light:#F0E9E0;\n  --accent-dark:#6B5538;\n  --success:#3A7D44;\n  --red:#C0392B;\n  --nav-h:68px;\n}\nhtml{scroll-behavior:smooth}\nbody{font-family:'DM Sans',sans-serif;background:var(--warm-white);color:var(--charcoal);font-size:15px;line-height:1.6;overflow-x:hidden}\n\n\u002F* SCROLLBAR *\u002F\n::-webkit-scrollbar{width:6px}\n::-webkit-scrollbar-track{background:var(--cream)}\n::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}\n\n\u002F* ===== NAV ===== *\u002F\nnav{position:fixed;top:0;left:0;right:0;z-index:900;height:var(--nav-h);background:rgba(253,252,250,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 2rem}\n.nav-inner{display:flex;align-items:center;width:100%;max-width:1400px;margin:0 auto;gap:2rem}\n.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:500;letter-spacing:0.08em;text-decoration:none;color:var(--charcoal);flex-shrink:0}\n.nav-links{display:flex;gap:1.8rem;list-style:none;margin-left:1rem}\n.nav-links a{text-decoration:none;color:var(--mid);font-size:0.82rem;letter-spacing:0.06em;text-transform:uppercase;transition:color .2s;cursor:pointer}\n.nav-links a:hover{color:var(--charcoal)}\n.nav-search{flex:1;max-width:320px;margin-left:auto;position:relative}\n.nav-search input{width:100%;padding:0.55rem 1rem 0.55rem 2.4rem;border:1px solid var(--border);border-radius:50px;font-size:0.82rem;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);outline:none;transition:border-color .2s,background .2s}\n.nav-search input:focus{border-color:var(--accent);background:#fff}\n.nav-search svg{position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}\n.nav-actions{display:flex;align-items:center;gap:0.2rem;margin-left:1rem}\n.nav-btn{background:none;border:none;cursor:pointer;padding:0.5rem;border-radius:8px;color:var(--mid);transition:color .2s,background .2s;position:relative;display:flex;align-items:center;justify-content:center}\n.nav-btn:hover{color:var(--charcoal);background:var(--cream)}\n.nav-btn .badge{position:absolute;top:4px;right:4px;width:16px;height:16px;background:var(--accent);color:#fff;border-radius:50%;font-size:0.6rem;display:flex;align-items:center;justify-content:center;font-weight:500;line-height:1}\n.nav-btn .badge.hidden{display:none}\n.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:0.5rem}\n.hamburger span{display:block;width:22px;height:1.5px;background:var(--charcoal);transition:.3s}\n\n\u002F* MOBILE NAV *\u002F\n.mobile-nav{display:none;position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;background:var(--warm-white);z-index:899;padding:2rem;flex-direction:column;gap:1.5rem;overflow-y:auto}\n.mobile-nav.open{display:flex}\n.mobile-nav a{text-decoration:none;color:var(--charcoal);font-size:1.1rem;letter-spacing:0.04em;cursor:pointer;border-bottom:1px solid var(--border);padding-bottom:1.5rem}\n\n\u002F* ===== PAGES ===== *\u002F\n.page{display:none;padding-top:var(--nav-h)}\n.page.active{display:block}\n\n\u002F* ===== HERO ===== *\u002F\n.hero{min-height:calc(100vh - var(--nav-h));display:grid;grid-template-columns:1fr 1fr;background:var(--cream)}\n.hero-text{display:flex;flex-direction:column;justify-content:center;padding:5rem 4rem 5rem 5rem}\n.hero-eyebrow{font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1.5rem}\n.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,5vw,5.5rem);font-weight:300;line-height:1.05;letter-spacing:-0.01em;margin-bottom:1.5rem}\n.hero-title em{font-style:italic;color:var(--accent)}\n.hero-sub{color:var(--mid);font-size:0.95rem;line-height:1.7;max-width:380px;margin-bottom:2.5rem}\n.hero-btns{display:flex;gap:1rem;flex-wrap:wrap}\n.btn-primary{display:inline-flex;align-items:center;gap:0.5rem;padding:0.85rem 2rem;background:var(--charcoal);color:#fff;border:1.5px solid var(--charcoal);border-radius:2px;font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s;text-decoration:none;font-family:'DM Sans',sans-serif}\n.btn-primary:hover{background:#333;border-color:#333}\n.btn-outline{display:inline-flex;align-items:center;gap:0.5rem;padding:0.85rem 2rem;background:transparent;color:var(--charcoal);border:1.5px solid var(--charcoal);border-radius:2px;font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s;text-decoration:none;font-family:'DM Sans',sans-serif}\n.btn-outline:hover{background:var(--charcoal);color:#fff}\n.btn-accent{display:inline-flex;align-items:center;gap:0.5rem;padding:0.85rem 2rem;background:var(--accent);color:#fff;border:1.5px solid var(--accent);border-radius:2px;font-size:0.82rem;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:background .2s;text-decoration:none;font-family:'DM Sans',sans-serif}\n.btn-accent:hover{background:var(--accent-dark)}\n.hero-image{position:relative;overflow:hidden}\n.hero-image img{width:100%;height:100%;object-fit:cover}\n.hero-image .hero-img-placeholder{width:100%;height:100%;min-height:600px;background:linear-gradient(135deg,#e8dfd0 0%,#d4c4a8 50%,#c2ad8a 100%);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--mid)}\n.hero-badge{position:absolute;bottom:2rem;left:2rem;background:var(--warm-white);padding:1rem 1.5rem;border-radius:2px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}\n.hero-badge-title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:500}\n.hero-badge-sub{font-size:0.75rem;color:var(--mid);letter-spacing:0.04em}\n\n\u002F* ===== CATEGORIES ===== *\u002F\n.section{padding:5rem 2rem;max-width:1400px;margin:0 auto}\n.section-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3rem}\n.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,3vw,3rem);font-weight:300}\n.section-link{font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);text-decoration:none;cursor:pointer;transition:opacity .2s;border-bottom:1px solid var(--accent)}\n.section-link:hover{opacity:.7}\n.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}\n.cat-card{cursor:pointer;position:relative;overflow:hidden;border-radius:2px;aspect-ratio:3\u002F4;transition:transform .4s}\n.cat-card:hover{transform:translateY(-4px)}\n.cat-card:hover .cat-img{transform:scale(1.05)}\n.cat-img{width:100%;height:100%;object-fit:cover;transition:transform .6s;display:block}\n.cat-placeholder{width:100%;height:100%;display:flex;align-items:flex-end;padding:1.5rem;transition:transform .6s}\n.cat-card:hover .cat-placeholder{transform:scale(1.05)}\n.cat-overlay{position:absolute;bottom:0;left:0;right:0;padding:1.5rem;background:linear-gradient(transparent,rgba(28,28,26,0.75));color:#fff}\n.cat-name{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400}\n.cat-count{font-size:0.75rem;opacity:.75;letter-spacing:0.04em}\n\n\u002F* ===== PRODUCTS ===== *\u002F\n.products-page{padding-top:var(--nav-h)}\n.products-header{background:var(--cream);padding:3rem 2rem;text-align:center}\n.products-header h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,4vw,4rem);font-weight:300;margin-bottom:0.5rem}\n.products-header p{color:var(--mid);font-size:0.9rem}\n.products-layout{display:grid;grid-template-columns:240px 1fr;gap:2rem;padding:2rem;max-width:1400px;margin:0 auto}\n.filters-panel{position:sticky;top:calc(var(--nav-h) + 1rem);height:fit-content}\n.filter-section{margin-bottom:2rem}\n.filter-title{font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--mid);margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}\n.filter-options{display:flex;flex-direction:column;gap:0.6rem}\n.filter-opt{display:flex;align-items:center;gap:0.6rem;cursor:pointer;font-size:0.88rem;color:var(--mid);transition:color .2s;user-select:none}\n.filter-opt:hover{color:var(--charcoal)}\n.filter-opt input{accent-color:var(--accent);cursor:pointer;width:15px;height:15px}\n.filter-opt.active{color:var(--charcoal);font-weight:500}\n.price-range{display:flex;flex-direction:column;gap:0.5rem}\n.price-range input[type=range]{width:100%;accent-color:var(--accent)}\n.price-label{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--mid)}\n.products-main{}\n.products-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:1rem}\n.toolbar-count{font-size:0.85rem;color:var(--mid)}\n.toolbar-sort{display:flex;align-items:center;gap:0.5rem;font-size:0.82rem;color:var(--mid)}\n.toolbar-sort select{border:1px solid var(--border);border-radius:2px;padding:0.4rem 0.8rem;font-size:0.82rem;font-family:'DM Sans',sans-serif;color:var(--charcoal);background:var(--warm-white);cursor:pointer;outline:none}\n.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem}\n\n\u002F* PRODUCT CARD *\u002F\n.product-card{cursor:pointer;border:1px solid transparent;border-radius:2px;transition:border-color .3s,transform .3s;position:relative;background:var(--warm-white)}\n.product-card:hover{border-color:var(--border);transform:translateY(-2px)}\n.product-card:hover .product-card-actions{opacity:1;transform:translateY(0)}\n.product-img-wrap{position:relative;overflow:hidden;background:var(--cream);aspect-ratio:1\u002F1;border-radius:2px}\n.product-img-wrap .product-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:0.9rem;color:var(--mid);text-align:center;padding:1rem;transition:transform .4s}\n.product-card:hover .product-placeholder{transform:scale(1.04)}\n.product-badge-wrap{position:absolute;top:0.75rem;left:0.75rem;display:flex;flex-direction:column;gap:0.3rem}\n.badge-new{background:var(--charcoal);color:#fff;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.2rem 0.5rem;border-radius:2px}\n.badge-sale{background:var(--accent);color:#fff;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.2rem 0.5rem;border-radius:2px}\n.product-card-actions{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0.75rem;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;gap:0.5rem}\n.quick-add{flex:1;padding:0.6rem;background:var(--charcoal);color:#fff;border:none;font-size:0.75rem;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;border-radius:2px;font-family:'DM Sans',sans-serif;transition:background .2s}\n.quick-add:hover{background:#333}\n.wishlist-btn-card{width:36px;height:36px;background:#fff;border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s;flex-shrink:0}\n.wishlist-btn-card:hover,.wishlist-btn-card.active{background:var(--accent-light);border-color:var(--accent)}\n.wishlist-btn-card svg{pointer-events:none}\n.product-info{padding:1rem 0.5rem 0.5rem}\n.product-name{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;margin-bottom:0.2rem}\n.product-cat-label{font-size:0.75rem;color:var(--mid);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.5rem}\n.product-price-row{display:flex;align-items:center;gap:0.75rem}\n.product-price{font-size:0.95rem;font-weight:500;color:var(--charcoal)}\n.product-price-old{font-size:0.85rem;color:var(--mid);text-decoration:line-through}\n.product-rating{display:flex;align-items:center;gap:0.3rem;margin-top:0.4rem}\n.stars{color:var(--accent);font-size:0.75rem;letter-spacing:1px}\n.star-count{font-size:0.72rem;color:var(--mid)}\n\n\u002F* ===== PRODUCT MODAL ===== *\u002F\n.modal-overlay{position:fixed;inset:0;background:rgba(28,28,26,0.6);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;padding:1rem}\n.modal-overlay.open{opacity:1;pointer-events:all}\n.modal-box{background:var(--warm-white);width:100%;max-width:900px;max-height:90vh;overflow-y:auto;border-radius:2px;display:grid;grid-template-columns:1fr 1fr;position:relative;animation:modalIn .35s ease}\n@keyframes modalIn{from{transform:translateY(20px) scale(0.98);opacity:0}to{transform:none;opacity:1}}\n.modal-close{position:absolute;top:1rem;right:1rem;background:var(--cream);border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}\n.modal-close:hover{background:var(--border)}\n.modal-gallery{background:var(--cream);min-height:400px;display:flex;align-items:center;justify-content:center;padding:2rem}\n.modal-gallery-placeholder{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--mid);text-align:center}\n.modal-gallery-thumbs{display:flex;gap:0.5rem;padding:0.75rem;border-top:1px solid var(--border)}\n.modal-thumb{width:60px;height:60px;border-radius:2px;border:2px solid transparent;cursor:pointer;overflow:hidden;transition:border-color .2s;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:0.55rem;color:var(--mid)}\n.modal-thumb.active,.modal-thumb:hover{border-color:var(--accent)}\n.modal-content{padding:2.5rem;overflow-y:auto}\n.modal-cat{font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:0.75rem}\n.modal-name{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;line-height:1.2;margin-bottom:0.75rem}\n.modal-rating-row{display:flex;align-items:center;gap:0.75rem;margin-bo safe'],bg:'#d0c4b0',svgPath:`<path d=\"M35 30 Q30 50 35 75 Q42 82 50 82 Q58 82 65 75 Q70 50 65 30 Q60 25 50 25 Q40 25 35 30Z\" stroke=\"rgba(100,80,60,0.4)\" stroke-width=\"0.8\" fill=\"rgba(255,255,255,0.2)\"\u002F><ellipse cx=\"50\" cy=\"30\" rx=\"15\" ry=\"5\" stroke=\"rgba(100,80,60,0.3)\" stroke-width=\"0.8\" fill=\"rgba(255,255,255,0.1)\"\u002F>`},\n];\n\nconst FEATURED_IDS=[1,2,3,10];\n\n\u002F\u002F ===== STATE =====\nlet cart=[],wishlist=[],currentFilter='all',currentProduct=null;\n\n\u002F\u002F ===== RENDER =====\nfunction renderStars(r){\n  const full=Math.floor(r),half=(r%1)>=0.5;\n  let s='';\n  for(let i=0;i<5;i++){\n    if(i<full)s+='★';\n    else if(i===full&&half)s+='½';\n    else s+='☆';\n  }\n  return s;\n}\n\nfunction productSVG(p,size=100){\n  return`<svg width=\"${size}\" height=\"${size}\" viewBox=\"0 0 100 100\" xmlns=\"http:\u002F\u002Fwww.w3.org\u002F2000\u002Fsvg\">${p.svgPath}<\u002Fsvg>`;\n}\n\nfunction productCard(p, inWishlist=false){\n  const wishlisted=wishlist.some(w=>w.id===p.id);\n  const priceHtml=p.oldPrice\n    ?`<span class=\"product-price\">RM ${p.price.toLocaleString()}<\u002Fspan><span class=\"product-price-old\">RM ${p.oldPrice.toLocaleString()}<\u002Fspan>`\n    :`<span class=\"product-price\">RM ${p.price.toLocaleString()}<\u002Fspan>`;\n  const badge=p.badge?`<span class=\"badge-${p.badge}\">${p.badge==='new'?'New':'Sale'}<\u002Fspan>`:'';\n  return`<div class=\"product-card\" onclick=\"openProduct(${p.id},event)\">\n    <div class=\"product-img-wrap\">\n      <div class=\"product-placeholder\" style=\"background:linear-gradient(135deg,${p.bg}cc,${p.bg})\">\n        ${p.image?`<img src=\"${p.image}\" alt=\"${p.name}\" style=\"width:100%;height:100%;object-fit:cover;display:block\">`:productSVG(p,80)}\n      <\u002Fdiv>\n      <div class=\"product-badge-wrap\">${badge}<\u002Fdiv>\n      <div class=\"product-card-actions\">\n        <button class=\"quick-add\" onclick=\"quickAdd(${p.id},event)\">Add to Cart<\u002Fbutton>\n        <button class=\"wishlist-btn-card ${wishlisted?'active':''}\" onclick=\"toggleWishlist(${p.id},event)\" title=\"${wishlisted?'Remove from wishlist':'Add to wishlist'}\">\n          <svg width=\"16\" height=\"16\" fill=\"${wishlisted?'#8B6F4E':'none'}\" stroke=\"${wishlisted?'#8B6F4E':'currentColor'}\" stroke-width=\"1.5\" viewBox=\"0 0 24 24\"><path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"\u002F><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"product-info\">\n      <div class=\"product-cat-label\">${p.category}<\u002Fdiv>\n      <div class=\"product-name\">${p.name}<\u002Fdiv>\n      <div class=\"product-price-row\">${priceHtml}<\u002Fdiv>\n      <div class=\"product-rating\">\n        <span class=\"stars\">${renderStars(p.rating)}<\u002Fspan>\n        <span class=\"star-count\">(${p.reviews})<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderFeatured(){\n  const el=document.getElementById('featuredGrid');\n  el.innerHTML=FEATURED_IDS.map(id=>productCard(PRODUCTS.find(p=>p.id===id))).join('');\n}\n\nfunction renderProducts(list){\n  const el=document.getElementById('productsGrid');\n  if(!list.length){\n    el.innerHTML=`<div style=\"grid-column:1\u002F-1;text-align:center;padding:4rem;color:var(--mid)\"><p style=\"font-family:'Cormorant Garamond',serif;font-size:1.5rem;margin-bottom:1rem\">No products found<\u002Fp><button class=\"btn-outline\" onclick=\"clearFilters()\">Clear filters<\u002Fbutton><\u002Fdiv>`;\n    return;\n  }\n  el.innerHTML=list.map(p=>productCard(p)).join('');\n  document.getElementById('toolbarCount').textContent=`${list.length} product${list.length===1?'':'s'}`;\n}\n\nfunction renderWishlist(){\n  const el=document.getElementById('wishlistGrid');\n  const empty=document.getElementById('wishlistEmpty');\n  if(!wishlist.length){el.innerHTML='';empty.style.display='block';return;}\n  empty.style.display='none';\n  el.innerHTML=wishlist.map(p=>productCard(p)).join('');\n}\n\n\u002F\u002F ===== FILTERS =====\nlet activeCats=[],activeMats=[],activeCols=[],maxPrice=5000;\n\nfunction getChecked(cls){\n  return [...document.querySelectorAll('.'+cls)].filter(c=>c.checked).map(c=>c.value);\n}\n\nfunction applyFilters(){\n  activeCats=getChecked('cat-filter');\n  activeMats=getChecked('mat-filter');\n  activeCols=getChecked('col-filter');\n  maxPrice=parseInt(document.getElementById('priceRange').value);\n  const sort=document.getElementById('sortSelect').value;\n\n  let list=PRODUCTS.filter(p=>{\n    const catOk=activeCats.length===0||activeCats.includes('all')||activeCats.includes(p.category);\n    const matOk=activeMats.length===0||activeMats.includes(p.material);\n    const colOk=activeCols.length===0||activeCols.includes(p.color);\n    const priceOk=p.price<=maxPrice;\n    return catOk&&matOk&&colOk&&priceOk;\n  });\n\n  if(sort==='price-asc')list.sort((a,b)=>a.price-b.price);\n  else if(sort==='price-desc')list.sort((a,b)=>b.price-a.price);\n  else if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));\n  else if(sort==='rating')list.sort((a,b)=>b.rating-a.rating);\n\n  renderProducts(list);\n}\n\nfunction clearFilters(){\n  document.querySelectorAll('.cat-filter,.mat-filter,.col-filter').forEach(c=>c.checked=false);\n  document.querySelectorAll('.cat-filter[value=\"all\"]').forEach(c=>c.checked=true);\n  document.getElementById('priceRange').value=5000;\n  document.getElementById('priceVal').textContent='RM 5,000';\n  document.getElementById('sortSelect').value='featured';\n  applyFilters();\n}\n\nfunction updatePrice(v){\n  document.getElementById('priceVal').textContent='RM '+parseInt(v).toLocaleString();\n}\n\n\u002F\u002F ===== PAGES =====\nfunction showPage(name,filter){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  const page=document.getElementById('page-'+name);\n  if(page)page.classList.add('active');\n  window.scrollTo({top:0,behavior:'smooth'});\n\n  if(name==='home')renderFeatured();\n  if(name==='products'){\n    const titles={all:'All Products',seating:'Seating',tables:'Tables & Surfaces',lighting:'Lighting',storage:'Storage',decor:'Decor',new:'New Arrivals'};\n    document.getElementById('productsPageTitle').textContent=titles[filter]||'All Products';\n    document.getElementById('productsPageSub').textContent=filter==='new'?'The latest additions to our collection':'Discover our curated collection';\n    \u002F\u002F Set category filter\n    document.querySelectorAll('.cat-filter').forEach(c=>c.checked=false);\n    if(filter&&filter!=='all'&&filter!=='new'){\n      const fc=document.querySelector(`.cat-filter[value=\"${filter}\"]`);\n      if(fc)fc.checked=true;\n    } else {\n      document.querySelector('.cat-filter[value=\"all\"]').checked=true;\n    }\n    if(filter==='new'){\n      let list=[...PRODUCTS].filter(p=>p.badge==='new');\n      renderProducts(list);\n      document.getElementById('toolbarCount').textContent=list.length+' products';\n    } else {\n      applyFilters();\n    }\n  }\n  if(name==='wishlist')renderWishlist();\n  if(name==='checkout')renderCheckout();\n}\n\n\u002F\u002F ===== CART =====\nfunction openCart(){\n  document.getElementById('cartDrawer').classList.add('open');\n  document.getElementById('cartOverlay').classList.add('open');\n  renderCart();\n}\nfunction closeCart(){\n  document.getElementById('cartDrawer').classList.remove('open');\n  document.getElementById('cartOverlay').classList.remove('open');\n}\n\nfunction addToCart(product,variant,qty=1){\n  const key=product.id+'|'+(variant||'Default');\n  const existing=cart.find(i=>i.key===key);\n  if(existing){existing.qty+=qty;}\n  else{cart.push({key,product,variant:variant||'Default',qty});}\n  updateCartBadge();\n  renderCart();\n}\n\nfunction removeFromCart(key){\n  cart=cart.filter(i=>i.key!==key);\n  updateCartBadge();\n  renderCart();\n}\n\nfunction changeQty(key,delta){\n  const item=cart.find(i=>i.key===key);\n  if(!item)return;\n  item.qty=Math.max(1,item.qty+delta);\n  renderCart();\n}\n\nfunction updateCartBadge(){\n  const total=cart.reduce((s,i)=>s+i.qty,0);\n  const badge=document.getElementById('cartBadge');\n  badge.textContent=total;\n  badge.classList.toggle('hidden',total===0);\n}\n\nfunction cartTotal(){\n  return cart.reduce((s,i)=>s+i.product.price*i.qty,0);\n}\n\nfunction renderCart(){\n  const el=document.getElementById('cartItems');\n  const footer=document.getElementById('cartFooter');\n  const empty=document.getElementById('cartEmpty');\n\n  if(!cart.length){\n    empty.style.display='block';\n    footer.style.display='none';\n    return;\n  }\n  empty.style.display='none';\n  footer.style.display='block';\n\n  const itemsHtml=cart.map(item=>`\n    <div class=\"cart-item\">\n      <div class=\"cart-item-img\" style=\"background:linear-gradient(135deg,${item.product.bg}99,${item.product.bg})\">\n        ${productSVG(item.product,40)}\n      <\u002Fdiv>\n      <div class=\"cart-item-info\">\n        <div class=\"cart-item-name\">${item.product.name}<\u002Fdiv>\n        <div class=\"cart-item-variant\">${item.variant}<\u002Fdiv>\n        <div class=\"cart-item-qty-row\">\n          <button class=\"cart-item-qty-btn\" onclick=\"changeQty('${item.key}',-1)\">−<\u002Fbutton>\n          <span class=\"cart-item-qty\">${item.qty}<\u002Fspan>\n          <button class=\"cart-item-qty-btn\" onclick=\"changeQty('${item.key}',1)\">+<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right\">\n        <div class=\"cart-item-price\">RM ${(item.product.price*item.qty).toLocaleString()}<\u002Fdiv>\n        <button class=\"cart-item-remove\" onclick=\"removeFromCart('${item.key}')\">Remove<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n\n  el.innerHTML=itemsHtml+`<div id=\"cartEmpty\" style=\"display:none\"><\u002Fdiv>`;\n  document.getElementById('cartSubtotal').textContent='RM '+cartTotal().toLocaleString();\n}\n\n\u002F\u002F ===== WISHLIST =====\nfunction toggleWishlist(id,event){\n  if(event)event.stopPropagation();\n  const p=PRODUCTS.find(x=>x.id===id);\n  const idx=wishlist.findIndex(x=>x.id===id);\n  if(idx>=0){wishlist.splice(idx,1);showToast('Removed from wishlist');}\n  else{wishlist.push(p);showToast('Added to wishlist ♡');}\n  updateWishlistBadge();\n  \u002F\u002F Re-render if needed\n  if(document.getElementById('page-wishlist').classList.contains('active'))renderWishlist();\n  \u002F\u002F Update all cards on page\n  document.querySelectorAll('.product-card').forEach(card=>{\n    const btn=card.querySelector('.wishlist-btn-card');\n    if(!btn)return;\n    const pid=parseInt(card.querySelector('.quick-add')?.getAttribute('onclick')?.match(\u002F\\d+\u002F)?.[0]);\n    if(pid===id){\n      const inW=wishlist.some(x=>x.id===id);\n      btn.classList.toggle('active',inW);\n      const svg=btn.querySelector('svg');\n      if(svg){svg.setAttribute('fill',inW?'#8B6F4E':'none');svg.setAttribute('stroke',inW?'#8B6F4E':'currentColor');}\n    }\n  });\n}\n\nfunction updateWishlistBadge(){\n  const badge=document.getElementById('wishlistBadge');\n  badge.textContent=wishlist.length;\n  badge.classList.toggle('hidden',wishlist.length===0);\n}\n\n\u002F\u002F ===== QUICK ADD =====\nfunction quickAdd(id,event){\n  if(event)event.stopPropagation();\n  const p=PRODUCTS.find(x=>x.id===id);\n  const variantKey=Object.keys(p.variants||{})[0];\n  const variantVal=variantKey?p.variants[variantKey][0]:null;\n  const variantStr=variantKey?`${variantKey}: ${variantVal}`:'Standard';\n  addToCart(p,variantStr,1);\n  showToast(`${p.name} added to cart`);\n  openCart();\n}\n\n\u002F\u002F ===== PRODUCT MODAL =====\nfunction openProduct(id,event){\n  if(event&&(event.target.classList.contains('quick-add')||event.target.closest('.wishlist-btn-card')))return;\n  const p=PRODUCTS.find(x=>x.id===id);\n  currentProduct={...p,selectedVariants:{},qty:1};\n  const inW=wishlist.some(w=>w.id===id);\n\n  \u002F\u002F Gallery\n  document.getElementById('modalGalleryMain').innerHTML=`\n    <div style=\"text-align:center\">\n      <div style=\"width:240px;height:240px;margin:0 auto;border-radius:4px;background:linear-gradient(135deg,${p.bg}99,${p.bg});display:flex;align-items:center;justify-content:center;overflow:hidden\">\n        ${p.image?`<img src=\"${p.image}\" alt=\"${p.name}\" style=\"width:100%;height:100%;object-fit:cover;display:block\">`:productSVG(p,120)}\n      <\u002Fdiv>\n      <p style=\"margin-top:1rem;font-size:0.9rem;color:var(--mid)\">${p.name}<\u002Fp>\n    <\u002Fdiv>\n  `;\n  const thumbs=['Main View','Detail','Room Context'];\n  document.getElementById('modalThumbs').innerHTML=thumbs.map((t,i)=>`<div class=\"modal-thumb ${i===0?'active':''}\" onclick=\"selectThumb(this,${i})\">${t}<\u002Fdiv>`).join('');\n\n  \u002F\u002F Variants\n  let variantsHtml='';\n  if(p.variants){\n    Object.entries(p.variants).forEach(([key,opts])=>{\n      currentProduct.selectedVariants[key]=opts[0];\n      variantsHtml+=`\n        <div style=\"margin-bottom:1.25rem\">\n          <div class=\"modal-label\">${key}: <span style=\"color:var(--charcoal);font-weight:500\" id=\"varLabel-${key.replace(\u002F\\s\u002Fg,'')}\">${opts[0]}<\u002Fspan><\u002Fdiv>\n          <div class=\"variant-grid\">${opts.map((o,i)=>`<button class=\"variant-btn ${i===0?'active':''}\" onclick=\"selectVariant('${key}','${o}',this)\">${o}<\u002Fbutton>`).join('')}<\u002Fdiv>\n        <\u002Fdiv>`;\n    });\n  }\n\n  const priceHtml=p.oldPrice\n    ?`<span class=\"modal-price\">RM ${p.price.toLocaleString()}<\u002Fspan><span class=\"modal-price-old\">RM ${p.oldPrice.toLocaleString()}<\u002Fspan>`\n    :`<span class=\"modal-price\">RM ${p.price.toLocaleString()}<\u002Fspan>`;\n\n  const featuresHtml=(p.features||[]).map(f=>`<li><svg width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"\u002F><\u002Fsvg>${f}<\u002Fli>`).join('');\n\n  document.getElementById('modalContent').innerHTML=`\n    <div class=\"modal-cat\">${p.category}<\u002Fdiv>\n    <h2 class=\"modal-name\">${p.name}<\u002Fh2>\n    <div class=\"modal-rating-row\">\n      <span class=\"stars\" style=\"font-size:1rem\">${renderStars(p.rating)}<\u002Fspan>\n      <span style=\"font-size:0.85rem;color:var(--mid)\">${p.rating} · ${p.reviews} reviews<\u002Fspan>\n      ${p.badge?`<span class=\"badge-${p.badge}\" style=\"margin-left:auto\">${p.badge==='new'?'New':'Sale'}<\u002Fspan>`:''}\n    <\u002Fdiv>\n    <div class=\"modal-price-row\">${priceHtml}<\u002Fdiv>\n    <p class=\"modal-desc\">${p.desc}<\u002Fp>\n    ${variantsHtml}\n    <div class=\"qty-row\">\n      <div class=\"modal-label\" style=\"margin-bottom:0\">Qty<\u002Fdiv>\n      <div class=\"qty-control\">\n        <button class=\"qty-btn\" onclick=\"changeModalQty(-1)\">−<\u002Fbutton>\n        <input class=\"qty-val\" id=\"modalQty\" type=\"number\" value=\"1\" min=\"1\" max=\"10\" readonly>\n        <button class=\"qty-btn\" onclick=\"changeModalQty(1)\">+<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-actions\">\n      <button class=\"btn-primary\" onclick=\"addFromModal()\">Add to Cart<\u002Fbutton>\n      <button class=\"modal-wishlist ${inW?'active':''}\" id=\"modalWishlistBtn\" onclick=\"toggleWishlistModal(${p.id})\" title=\"Wishlist\">\n        <svg width=\"20\" height=\"20\" fill=\"${inW?'#8B6F4E':'none'}\" stroke=\"${inW?'#8B6F4E':'currentColor'}\" stroke-width=\"1.5\" viewBox=\"0 0 24 24\"><path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"\u002F><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <ul class=\"modal-features\">${featuresHtml}<\u002Ful>\n  `;\n\n  document.getElementById('productModal').classList.add('open');\n  document.body.style.overflow='hidden';\n}\n\nfunction selectThumb(el,idx){\n  document.querySelectorAll('.modal-thumb').forEach(t=>t.classList.remove('active'));\n  el.classList.add('active');\n}\n\nfunction selectVariant(key,val,btn){\n  if(currentProduct)currentProduct.selectedVariants[key]=val;\n  const label=document.getElementById('varLabel-'+key.replace(\u002F\\s\u002Fg,''));\n  if(label)label.textContent=val;\n  btn.closest('.variant-grid').querySelectorAll('.variant-btn').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n}\n\nfunction changeModalQty(d){\n  if(!currentProduct)return;\n  currentProduct.qty=Math.max(1,Math.min(10,(currentProduct.qty||1)+d));\n  const el=document.getElementById('modalQty');\n  if(el)el.value=currentProduct.qty;\n}\n\nfunction addFromModal(){\n  if(!currentProduct)return;\n  const varStr=Object.entries(currentProduct.selectedVariants).map(([k,v])=>`${k}: ${v}`).join(', ')||'Standard';\n  addToCart(currentProduct,varStr,currentProduct.qty||1);\n  showToast(`${currentProduct.name} added to cart`);\n  closeModal();\n  openCart();\n}\n\nfunction toggleWishlistModal(id){\n  toggleWishlist(id,null);\n  const btn=document.getElementById('modalWishlistBtn');\n  const inW=wishlist.some(w=>w.id===id);\n  if(btn){\n    btn.classList.toggle('active',inW);\n    const svg=btn.querySelector('svg');\n    if(svg){svg.setAttribute('fill',inW?'#8B6F4E':'none');svg.setAttribute('stroke',inW?'#8B6F4E':'currentColor');}\n  }\n}\n\nfunction closeModal(){\n  document.getElementById('productModal').classList.remove('open');\n  document.body.style.overflow='';\n  currentProduct=null;\n}\n\nfunction handleModalClick(e){\n  if(e.target===document.getElementById('productModal'))closeModal();\n}\n\n\u002F\u002F ===== SEARCH =====\nfunction handleSearch(q){\n  if(!q.trim())return;\n}\n\nfunction doSearch(){\n  const q=document.getElementById('searchInput').value.trim().toLowerCase();\n  if(!q)return;\n  const results=PRODUCTS.filter(p=>\n    p.name.toLowerCase().includes(q)||\n    p.category.toLowerCase().includes(q)||\n    p.material.toLowerCase().includes(q)||\n    p.desc.toLowerCase().includes(q)\n  );\n  document.getElementById('searchResultTitle').textContent=`Search: \"${document.getElementById('searchInput').value}\"`;\n  document.getElementById('searchResultSub').textContent=`${results.length} result${results.length===1?'':'s'} found`;\n  document.getElementById('searchGrid').innerHTML=results.length?results.map(p=>productCard(p)).join(''):`<div style=\"grid-column:1\u002F-1;text-align:center;padding:4rem;color:var(--mid)\"><p style=\"font-family:'Cormorant Garamond',serif;font-size:1.5rem\">No results found for \"${document.getElementById('searchInput').value}\"<\u002Fp><button class=\"btn-outline\" style=\"margin-top:1rem\" onclick=\"showPage('products','all')\">Browse All<\u002Fbutton><\u002Fdiv>`;\n  showPage('search');\n}\n\n\u002F\u002F Also trigger search on input after 2+ chars\ndocument.getElementById('searchInput').addEventListener('keydown',function(e){\n  if(e.key==='Enter')doSearch();\n});\n\n\u002F\u002F ===== CHECKOUT =====\nfunction goCheckout(){\n  if(!cart.length){showToast('Your cart is empty');return;}\n  showPage('checkout');\n}\n\nfunction renderCheckout(){\n  const items=document.getElementById('checkoutItems');\n  items.innerHTML=cart.map(item=>`\n    <div class=\"order-item-row\">\n      <div class=\"order-item-img\" style=\"background:linear-gradient(135deg,${item.product.bg}66,${item.product.bg}99)\">\n        ${productSVG(item.product,30)}\n      <\u002Fdiv>\n      <div class=\"order-item-details\">\n        <div class=\"order-item-name\">${item.product.name} ×${item.qty}<\u002Fdiv>\n        <div class=\"order-item-variant\">${item.variant}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"order-item-price\">RM ${(item.product.price*item.qty).toLocaleString()}<\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n\n  const sub=cartTotal();\n  const shipping=sub>=500?0:80;\n  const tax=Math.round(sub*0.06);\n  const total=sub+shipping+tax;\n\n  document.getElementById('checkoutSubtotal').textContent='RM '+sub.toLocaleString();\n  document.getElementById('checkoutShipping').textContent=shipping===0?'Free':'RM '+shipping;\n  document.getElementById('checkoutTax').textContent='RM '+tax.toLocaleString();\n  document.getElementById('checkoutTotal').textContent='RM '+total.toLocaleString();\n}\n\nfunction applyPromo(){\n  const code=document.getElementById('promoInput').value.trim().toUpperCase();\n  if(code==='MAISON10'||code==='WELCOME'){showToast('Promo code applied! 10% off');}\n  else if(code){showToast('Invalid promo code');}\n}\n\nfunction placeOrder(){\n  const ref='MSN-'+Math.floor(100000+Math.random()*900000);\n  document.getElementById('orderRef').textContent=ref;\n  cart=[];\n  updateCartBadge();\n  renderCart();\n  showPage('success');\n}\n\n\u002F\u002F ===== NEWSLETTER =====\nfunction subscribeNewsletter(){\n  const email=document.getElementById('newsletterEmail').value;\n  if(!email||!email.includes('@')){showToast('Please enter a valid email');return;}\n  showToast('Welcome to Maison! Check your inbox.');\n  document.getElementById('newsletterEmail').value='';\n}\n\n\u002F\u002F ===== MOBILE NAV =====\nfunction toggleMobileNav(){\n  document.getElementById('mobileNav').classList.toggle('open');\n}\nfunction closeMobileNav(){\n  document.getElementById('mobileNav').classList.remove('open');\n}\n\n\u002F\u002F ===== TOAST =====\nfunction showToast(msg){\n  const t=document.getElementById('toast');\n  t.textContent=msg;\n  t.classList.add('show');\n  setTimeout(()=>t.classList.remove('show'),2800);\n}\n\n\u002F\u002F ===== INIT =====\nrenderFeatured();\napplyFilters();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
